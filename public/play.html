<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="conn" class="conn" role="status">Sin conexión. Reintentando…</div>
  <main class="phone">

    <form id="join" class="stack" autocomplete="off">
      <h1>Unirse a la partida</h1>
      <div>
        <label for="code-in">Código de sala</label>
        <input id="code-in" maxlength="4" autocapitalize="characters" required>
      </div>
      <div>
        <label for="name-in">Tu nombre</label>
        <input id="name-in" maxlength="16" required>
      </div>
      <button class="primary" type="submit">Entrar</button>
      <p id="join-err" class="error" role="alert"></p>
    </form>

    <section id="lobby" class="stack" hidden>
      <h1>Estás dentro</h1>
      <p class="mute">Espera a que se inicie la partida en la pantalla común.</p>
      <ul id="roster-lobby" class="roster"></ul>
    </section>

    <section id="game" class="stack" hidden>
      <p id="pausebar" class="pausebar" hidden>Partida en pausa</p>
      <div>
        <h2 id="phase"></h2>
        <p id="timer" class="timer"></p>
      </div>
      <div id="action" class="stack"></div>
      <div id="result" class="result"></div>
      <button id="rolecard" class="rolecard" aria-live="polite"></button>
      <p id="comp" class="mute"></p>
      <ul id="roster-game" class="roster"></ul>
    </section>

  </main>

  <script src="/common.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const KEY = 'gnosia:player';
    const urlCode = (new URLSearchParams(location.search).get('sala') || '').toUpperCase();
    let session = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (session && urlCode && session.code !== urlCode) session = null;

    let state = null, roleMsg = null, reports = [], myVote = null, intents = null, notice = '';
    let night = null, nightDone = false, nightSel = null, nightRevealed = false;
    let view = 'root', socialTarget = null, lastName = '';

    $('#code-in').value = urlCode;

    const api = Gnosia.connect({
      onOpen(api) { if (session) api.send({ t: 'player:resume', code: session.code, token: session.token }); },
      onMessage(m) {
        if (m.t === 'player:joined') {
          session = { code: m.code, token: m.token, playerId: m.playerId };
          localStorage.setItem(KEY, JSON.stringify(session));
        } else if (m.t === 'state') {
          state = m; Gnosia.syncClock(m); render();
        } else if (m.t === 'you:role') {
          roleMsg = m; renderRole(false); keepAwake();
        } else if (m.t === 'you:report') {
          reports.push(m.report); renderAction(); renderRole(false);
        } else if (m.t === 'you:reports') {
          reports = m.reports; renderRole(false);
        } else if (m.t === 'vote:ack') {
          myVote = m.target; notice = ''; renderAction();
        } else if (m.t === 'night:prompt') {
          night = m; nightDone = m.acted; nightSel = m.selected; nightRevealed = m.revealed; view = 'root'; renderAction();
        } else if (m.t === 'night:ack') {
          notice = '';
          if (m.kind === 'reveal') { nightRevealed = true; view = 'root'; socialTarget = null; }
          else { nightDone = true; if (m.target) nightSel = m.target; }
          renderAction();
        } else if (m.t === 'ally:intents') {
          intents = m; renderAction();
        } else if (m.t === 'error') {
          if (m.code === 'SESSION_LOST') { localStorage.removeItem(KEY); session = null; state = null; render(); }
          else if (state && session && state.phase !== 'LOBBY') { notice = m.message; renderAction(); }
          else $('#join-err').textContent = m.message;
        }
      },
    });

    $('#join').addEventListener('submit', (e) => {
      e.preventDefault();
      $('#join-err').textContent = '';
      api.send({ t: 'player:join', code: $('#code-in').value.trim().toUpperCase(), name: $('#name-in').value });
    });

    function show(v) { for (const id of ['join', 'lobby', 'game']) $('#' + id).hidden = id !== v; }

    function render() {
      if (!session || !state) return show('join');
      if (state.phase !== 'VOTE') myVote = null;
      if (state.phase !== 'NIGHT') { night = null; nightDone = false; nightSel = null; nightRevealed = false; view = 'root'; socialTarget = null; }
      if (intents && ((intents.kind === 'attack' && state.phase !== 'NIGHT') || (intents.kind === 'vote' && state.phase !== 'VOTE'))) intents = null;
      if (state.phase === 'LOBBY') {
        roleMsg = null; reports = [];
        show('lobby');
        Gnosia.renderRoster($('#roster-lobby'), state.players, session.playerId);
      } else {
        show('game');
        $('#pausebar').hidden = !state.paused;
        $('#phase').textContent = Gnosia.PHASE_LABEL[state.phase] || state.phase;
        Gnosia.renderRoster($('#roster-game'), state.players, session.playerId);
        $('#comp').textContent = state.composition
          ? 'En la nave: ' + Object.entries(state.composition).filter(([, n]) => n > 0).map(([r, n]) => Gnosia.ROLE[r].name + ' ×' + n).join(' · ') : '';
        renderRole(false);
        Gnosia.renderResult($('#result'), state.result);
        renderAction();
      }
      tick();
    }

    // ---------- votación y noche ----------
    function btn(label, cls, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener('click', onClick);
      return b;
    }
    const choice = (label, selected, onClick) => btn(label, selected ? 'selected' : '', onClick);

    function renderAction() {
      const box = $('#action');
      box.replaceChildren();
      const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; box.append(e); return e; };
      const me = state && session && state.players.find((p) => p.id === session.playerId);
      if (!me) return;
      if (state.paused) return add('p', 'mute', 'Esperen a que el anfitrión reanude la partida.');
      if (!me.alive && state.phase !== 'GAME_OVER' && state.phase !== 'LOBBY') return add('p', 'mute', 'Fuiste eliminado. Sigue la partida como observador.');
      if (state.phase === 'VOTE') renderVote(box, add, me);
      else if (state.phase === 'NIGHT' && night) renderNight(box, add, me);
      if (notice) add('p', 'error', notice);
    }

    // Los infectados ven en vivo la intención de sus aliados.
    function allyLines(add, me) {
      const others = intents.intents.filter((i) => i.name !== me.name);
      if (!others.length) return;
      add('p', 'mute', 'Tus aliados:');
      others.forEach((i) => add('p', '', i.name + ' → ' + (i.target === 'skip' ? 'no votar' : i.target || 'sin decidir')));
    }

    function renderVote(box, add, me) {
      add('h2', '', '¿A quién pones en cuarentena?');
      const list = document.createElement('div'); list.className = 'choices';
      for (const p of state.players.filter((x) => x.alive && x.id !== me.id)) {
        list.append(choice(p.name, myVote === p.id, () => api.send({ t: 'player:vote', target: p.id })));
      }
      list.append(choice('No votar a nadie', myVote === 'skip', () => api.send({ t: 'player:vote', target: 'skip' })));
      box.append(list);
      add('p', 'mute', 'Puedes cambiar tu voto hasta que termine el tiempo.');
      if (intents && intents.kind === 'vote') allyLines(add, me);
    }

    const QUESTION = {
      gnosia: '¿A quién atacas esta noche?', engineer: '¿A quién analizas?', guardian: '¿A quién proteges?',
      doctor: '¿A qué eliminado examinas?', crew: '¿Cerca de quién haces ronda?',
    };

    function renderNight(box, add, me) {
      const go = (v) => () => { view = v; socialTarget = null; notice = ''; renderAction(); };
      const back = () => btn('Volver', '', go('root'));

      if (view === 'root') {
        add('h2', '', 'Es de noche');
        add('p', 'mute', 'Elige qué hacer. Todo se resuelve al amanecer.');
        const col = document.createElement('div'); col.className = 'stack';
        col.append(btn('Acción propia' + (nightDone ? ' ✓' : ''), '', go('role')));
        col.append(btn('Acción social' + (nightRevealed ? ' ✓' : ''), '', go('social')));
        box.append(col);
        return;
      }

      if (view === 'role') {
        add('h2', '', QUESTION[night.role]);
        if (night.role !== 'gnosia' && nightDone) {
          const rep = reports.filter((x) => x.night === night.night && ['investigate', 'examine', 'protect'].includes(x.kind)).pop();
          if (rep && rep.kind === 'protect') add('p', 'verdict', 'Sellaste la cabina de ' + rep.name + '.');
          else if (rep) add('p', 'verdict', Gnosia.describeReport(rep).replace(/^Noche \d+: /, ''));
          else add('p', '', lastName ? 'Hiciste una ronda cerca de ' + lastName + '. No notaste nada extraño.' : 'Hiciste tu ronda. No notaste nada extraño.');
          box.append(back());
          return;
        }
        if (!night.targets.length) {
          add('p', 'mute', night.role === 'doctor' ? 'Todavía no hay fallecidos para examinar.' : 'No hay nadie a quien elegir.');
          box.append(back());
          return;
        }
        const list = document.createElement('div'); list.className = 'choices';
        for (const t of night.targets) {
          list.append(choice(t.name, nightSel === t.id, () => { lastName = t.name; api.send({ t: 'player:night', target: t.id }); }));
        }
        box.append(list);
        if (night.role === 'gnosia') {
          add('p', 'mute', 'Puedes cambiar tu elección hasta que termine la noche.');
          if (intents && intents.kind === 'attack') allyLines(add, me);
        }
        box.append(back());
        return;
      }

      // Acción social: revelar el rol a un jugador, en privado y al amanecer.
      add('h2', '', 'Acción social: revelar mi rol');
      add('p', 'mute', 'Se entrega en privado al amanecer. Lo que hagan después, en voz alta, es cosa de ustedes.');
      if (nightRevealed) { add('p', '', 'Ya hiciste tu acción social esta noche.'); box.append(back()); return; }
      const list = document.createElement('div'); list.className = 'choices';
      if (!socialTarget) {
        add('p', '', '¿A quién se lo revelas?');
        for (const t of night.revealTargets) list.append(choice(t.name, false, () => { socialTarget = t; renderAction(); }));
      } else {
        add('p', '', 'Para ' + socialTarget.name + ':');
        for (const c of night.claims) {
          list.append(choice('Soy ' + Gnosia.ROLE[c].name, false, () => api.send({ t: 'player:reveal', target: socialTarget.id, claim: c })));
        }
      }
      box.append(list);
      box.append(back());
    }

    // ---------- rol e informes (mantener presionado) ----------
    const card = $('#rolecard');
    function renderRole(shown) {
      card.classList.toggle('shown', shown);
      card.classList.toggle('gnosia', shown && !!roleMsg && roleMsg.role === 'gnosia');
      card.replaceChildren();
      const line = (cls, text) => { const p = document.createElement('p'); if (cls) p.className = cls; p.textContent = text; card.append(p); };
      if (!roleMsg) return line('mute', 'Esperando tu rol…');
      if (!shown) return line('mute', 'Mantén presionado para ver tu rol' + (reports.length ? ' e informes (' + reports.length + ')' : ''));
      const r = Gnosia.ROLE[roleMsg.role];
      line('role-name', r.name);
      line('', roleMsg.story || r.hint);
      if (roleMsg.allies && roleMsg.allies.length) line('mute', 'Tus aliados: ' + roleMsg.allies.join(', '));
      if (reports.length) { line('mute', 'Informes'); reports.forEach((x) => line('', Gnosia.describeReport(x))); }
    }
    const hold = (e) => { e.preventDefault(); renderRole(true); };
    const release = () => renderRole(false);
    card.addEventListener('pointerdown', hold);
    ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach((ev) => card.addEventListener(ev, release));
    card.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') hold(e); });
    card.addEventListener('keyup', release);
    card.addEventListener('contextmenu', (e) => e.preventDefault());

    function tick() {
      if (state && state.paused) { $('#timer').textContent = Gnosia.fmtTime(Math.ceil(state.remainingMs / 1000)); return; }
      if (!state || state.phase === 'LOBBY' || !state.phaseEndsAt) { $('#timer').textContent = ''; return; }
      $('#timer').textContent = Gnosia.fmtTime(Gnosia.remaining(state.phaseEndsAt));
    }
    setInterval(tick, 250);

    // Evita que el celular apague la pantalla durante la partida.
    let lock = null;
    async function keepAwake() {
      try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch {}
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && roleMsg) keepAwake(); });
  </script>
</body>
</html>
